[project]
name = "deep-research"
version = "0.1.0"
description = "Portfolio deep research agent"
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.20",
    "fastapi>=0.115",
    "idna>=3.7",
    "langgraph-checkpoint-sqlite>=2.0",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
    "tavily-python>=0.5",
    "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
rag = [
    "dashscope>=1.23",
    "docling>=2.0",
    "python-multipart>=0.0.12",
    "qdrant-client>=1.12",
    "sentence-transformers>=3.2",
    "transformers>=4.45",
]
dev = [
    "httpx>=0.27",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
